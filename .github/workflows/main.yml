name: Shellcheck
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - name: Run shellcheck.
      run: |
        shellcheck pfetch
        shellcheck tests/minimal-env.sh
        TERM=dumb sh pfetch
    - name: Run minimal-environment regression tests.
      run: |
        sh tests/minimal-env.sh
